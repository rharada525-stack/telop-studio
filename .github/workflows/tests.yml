name: Regression tests

on:
  push:
    paths: ["telop-studio/**", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["telop-studio/**", "tests/**", ".github/workflows/tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/regressions.test.mjs
