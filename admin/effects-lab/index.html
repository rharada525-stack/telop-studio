<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>演出ラボ | テロップスタジオ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&family=M+PLUS+Rounded+1c:wght@800&family=Shippori+Mincho+B1:wght@800&family=Yusei+Magic&family=Yuji+Boku&display=swap" rel="stylesheet">
<link href="lab.css?v=20261022-effects3" rel="stylesheet">
<link href="../../telop-studio/css/font-picker.css?v=20261022-fonts1" rel="stylesheet">
</head>
<body>
<header><div><strong>テロップスタジオ <span>演出ラボ</span></strong><small>LOCAL / ADMIN</small></div><p>試作はこのページだけ。本体への反映は別途行います。</p></header>
<p id="blocked" hidden>このページはローカル専用です。Start-Lab.ps1から開いてください。</p>
<main id="lab" hidden>
  <aside class="library panel">
    <h1>演出を選ぶ</h1>
    <input id="search" type="search" placeholder="演出を検索" aria-label="演出を検索">
    <nav id="effects" aria-label="演出の一覧"></nav>
    <details class="drafts" open><summary>保存した試作</summary>
      <select id="saved" aria-label="保存した試作"><option value="">試作を選択</option></select>
      <button id="load" type="button" class="ghost">読み込む</button>
      <label class="file-button">JSONを読み込む<input id="import" type="file" accept="application/json,.json" hidden></label>
    </details>
  </aside>

  <section class="viewer panel" aria-label="演出プレビュー">
    <div class="viewer-bar"><h2 id="effectTitle">キーワード</h2><label><input type="checkbox" id="compare"> 元と比較</label></div>
    <div id="screens" class="screens">
      <figure id="originalFigure" hidden><figcaption>元の演出</figcaption><canvas id="original" aria-label="元の演出プレビュー"></canvas></figure>
      <figure><figcaption>試作 <span id="styleName"></span></figcaption><canvas id="preview" aria-label="試作プレビュー"></canvas></figure>
    </div>
    <div class="transport">
      <div class="play-row"><button id="play" type="button">▶ 再生</button><button id="replay" type="button" class="ghost">↶ 最初から</button><button id="prev" type="button" class="ghost" aria-label="1コマ戻る">−1f</button><button id="next" type="button" class="ghost" aria-label="1コマ進む">＋1f</button><output id="clock">0.00s</output></div>
      <input id="seek" type="range" min="0" max="4.2" step="0.033333333333" value="0" aria-label="演出の再生位置">
      <div class="play-row options"><label>速度<select id="speed"><option value="0.25">0.25倍</option><option value="0.5">0.5倍</option><option value="1" selected>1倍</option></select></label><label><input type="checkbox" id="loop" checked> ループ</label><label><input type="checkbox" id="sound" checked> 効果音</label><label><input type="checkbox" id="guides"> ガイド</label><button id="png" type="button" class="ghost" title="比較・共有用の静止画です。">確認画像を保存</button></div>
    </div>
    <div class="background-controls"><label>背景<select id="background"><option value="scene">テスト背景</option><option value="dark">暗い背景</option><option value="light">明るい背景</option><option value="checker">市松</option></select></label><label class="file-button">画像・動画を使う<input id="media" type="file" accept="image/*,video/*" hidden></label><button id="clearMedia" class="ghost" type="button" hidden>素材を外す</button><label id="offsetLabel" hidden>動画の開始位置（秒）<input id="offset" type="number" min="0" step="0.1" value="0"></label><span id="mediaName"></span></div>
    <p id="status" role="status" aria-live="polite">準備中…</p>
  </section>

  <aside class="inspector panel">
    <h2>試作する</h2>
    <div class="two"><label>画面<select id="aspect"><option value="landscape">横 16:9</option><option value="portrait">縦 9:16</option></select></label><label>デザインセット<select id="set"></select></label></div>
    <label>演出の文字<textarea id="text" rows="2" maxlength="300"></textarea></label>
    <div class="samples"><button data-sample="short" class="ghost" type="button">短文</button><button data-sample="long" class="ghost" type="button">長文</button><button data-sample="lines" class="ghost" type="button">2行</button><button data-sample="default" class="ghost" type="button">見本に戻す</button></div>
    <small>{ } は強調色、[ ] は強調色2</small>
    <label><input type="checkbox" id="separate" checked> 通常の字幕も重ねる</label>
    <label id="subtitleLabel">通常の字幕<textarea id="subtitle" rows="2" maxlength="300"></textarea></label>
    <div class="two"><label>表示時間（秒）<input id="duration" type="number" min="0.5" max="12" step="0.1"></label><label>位置<select id="position"></select></label></div>
    <label>画面効果<select id="screen"></select></label>
    <hr>
    <label>調整するパーツ<select id="part"></select></label>
    <label>文字色<input id="fill" type="color" value="#ffd84a"></label>
    <div class="two"><label>文字サイズ<input id="size" type="number" min="12" max="400" step="1"></label><label>傾き（度）<input id="rotate" type="number" min="-180" max="180" step="1"></label></div>
    <div class="two"><label>登場<select id="enter"></select></label><label>退場<select id="exit"></select></label></div>
    <div class="two"><label>1文字ずつ<select id="character"><option value="">なし</option><option value="pop">ポップ</option><option value="type">タイプ</option><option value="drop">落下</option></select></label><label>文字の間隔（秒）<input id="stagger" type="number" min="0" max="0.3" step="0.005"></label></div>
    <div class="two"><label>表示中<select id="idle"></select></label><label>退場時間（秒）<input id="outDuration" type="number" min="0" max="2" step="0.05"></label></div>
    <details id="advanced"><summary>スタイルJSON</summary><p>選択中のパーツ・縦横だけに適用</p><textarea id="json" spellcheck="false" aria-label="スタイルJSON" rows="14"></textarea><button id="applyJson" type="button" class="ghost">JSONを適用</button></details>
    <button id="resetStyle" type="button" class="ghost">このパーツを元に戻す</button>
    <hr>
    <label>試作の名前<input id="name" type="text" maxlength="80"></label>
    <div class="two"><button id="save" type="button">試作を保存</button><button id="export" type="button" class="ghost">JSONに保存</button></div>
    <button id="saveAs" type="button" class="ghost">別の試作として保存</button>
    <button id="new" type="button" class="ghost">新しい試作</button>
    <hr>
    <h2>Premiere用XML</h2>
    <small id="nativeNote">文字編集・フォントは確認済み。新しい色・配置・動きは実機確認用です。演出の文字だけを書き出します。</small>
    <small id="xmlSupport" role="status"></small>
    <div id="xmlFontPicker"><label>XMLのフォント（PostScript名）<input id="xmlFont" type="text" value="NotoSansJP-Black" maxlength="63"></label></div>
    <button id="nativeExport" type="button" class="ghost">この演出をXMLに保存</button>
    <button id="nativeBatch" type="button" class="ghost">演出3案のXMLを保存</button>
    <small>3案は元の見本をまとめます。通常字幕・背景・画面効果・効果音は含みません。</small>
  </aside>
</main>
<script type="module" src="lab.js?v=20261022-effects3"></script>
</body>
</html>
